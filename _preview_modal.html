<!doctype html><meta charset="utf-8"><link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
/* ═══════════════════════════════════════════════════════════
   TDS Mobile 토큰 기반 · 토스페이먼츠 문서 레이아웃 아키타입 적용
   컬러  : tds-colors.css (@toss/tds-colors 0.1.0 · adaptive* 토큰)
   타이포: TDS t1~t7 스케일 (본문급 행간 1.5 고정 / 제목급 배율 축소)
   간격  : TDS ListRow 스케일 (8·12·16·24)
   ═══════════════════════════════════════════════════════════ */

:root{
  /* @toss/tds-colors 0.1.0 · colors.light.css 원본 토큰 112개 (인라인) */
  /* -- Background -- */
  --adaptiveBackground:#ffffff; --adaptiveBackgroundDimmed:rgba(0,0,0,0.2); --adaptiveBackgroundLevel01:#ffffff;
  --adaptiveBackgroundLevel02:#ffffff; --adaptiveBackgroundLevelB01:#f2f4f6; --adaptiveDimmedBackground:rgba(0,0,0,0.2);
  --adaptiveFloatBackground:#ffffff; --adaptiveGreyBackground:#f2f4f6; --adaptiveLayeredBackground:#ffffff;
  /* -- HairlineBorder -- */
  --adaptiveHairlineBorder:#e5e8eb;
  /* -- PcScreenBg -- */
  --adaptivePcScreenBg:#f6f7f9;
  /* -- Blue -- */
  --adaptiveBlue100:#c9e2ff; --adaptiveBlue200:#90c2ff; --adaptiveBlue300:#64a8ff;
  --adaptiveBlue400:#4593fc; --adaptiveBlue50:#e8f3ff; --adaptiveBlue500:#3182f6;
  --adaptiveBlue600:#2272eb; --adaptiveBlue700:#1b64da; --adaptiveBlue800:#1957c2;
  --adaptiveBlue900:#194aa6; --adaptiveDisabledBlue500:#c9e2ff;
  /* -- Grey -- */
  --adaptiveGrey100:#f2f4f6; --adaptiveGrey200:#e5e8eb; --adaptiveGrey300:#d1d6db;
  --adaptiveGrey400:#b0b8c1; --adaptiveGrey50:#f9fafb; --adaptiveGrey500:#8b95a1;
  --adaptiveGrey600:#6b7684; --adaptiveGrey700:#4e5968; --adaptiveGrey800:#333d4b;
  --adaptiveGrey900:#191f28; --adaptiveGreyOpacity100:rgba(2,32,71,0.05); --adaptiveGreyOpacity200:rgba(0,27,55,0.1);
  --adaptiveGreyOpacity300:rgba(0,29,58,0.18); --adaptiveGreyOpacity400:rgba(0,25,54,0.31); --adaptiveGreyOpacity50:rgba(0,23,51,0.02);
  --adaptiveGreyOpacity500:rgba(3,24,50,0.46); --adaptiveGreyOpacity600:rgba(0,19,43,0.58); --adaptiveGreyOpacity700:rgba(3,18,40,0.7);
  --adaptiveGreyOpacity800:rgba(0,12,30,0.8); --adaptiveGreyOpacity900:rgba(2,9,19,0.91);
  /* -- Opacity -- */
  --adaptiveOpacity100:rgba(2,32,71,0.05); --adaptiveOpacity200:rgba(0,27,55,0.1); --adaptiveOpacity300:rgba(0,29,58,0.18);
  --adaptiveOpacity400:rgba(0,25,54,0.31); --adaptiveOpacity50:rgba(0,23,51,0.02); --adaptiveOpacity500:rgba(3,24,50,0.46);
  --adaptiveOpacity600:rgba(0,19,43,0.58); --adaptiveOpacity700:rgba(3,18,40,0.7); --adaptiveOpacity800:rgba(0,12,30,0.8);
  --adaptiveOpacity900:rgba(2,9,19,0.91);
  /* -- Green -- */
  --adaptiveGreen100:#aeefd5; --adaptiveGreen200:#76e4b8; --adaptiveGreen300:#3fd599;
  --adaptiveGreen400:#15c47e; --adaptiveGreen50:#f0faf6; --adaptiveGreen500:#03b26c;
  --adaptiveGreen600:#02a262; --adaptiveGreen700:#029359; --adaptiveGreen800:#028450;
  --adaptiveGreen900:#027648;
  /* -- Red -- */
  --adaptiveRed100:#ffd4d6; --adaptiveRed200:#feafb4; --adaptiveRed300:#fb8890;
  --adaptiveRed400:#f66570; --adaptiveRed50:#ffeeee; --adaptiveRed500:#f04452;
  --adaptiveRed600:#e42939; --adaptiveRed700:#d22030; --adaptiveRed800:#bc1b2a;
  --adaptiveRed900:#a51926;
  /* -- Orange -- */
  --adaptiveOrange100:#ffe0b0; --adaptiveOrange200:#ffcd80; --adaptiveOrange300:#ffbd51;
  --adaptiveOrange400:#ffa927; --adaptiveOrange50:#fff3e0; --adaptiveOrange500:#fe9800;
  --adaptiveOrange600:#fb8800; --adaptiveOrange700:#f57800; --adaptiveOrange800:#ed6700;
  --adaptiveOrange900:#e45600;
  /* -- Yellow -- */
  --adaptiveYellow100:#ffefbf; --adaptiveYellow200:#ffe69b; --adaptiveYellow300:#ffdd78;
  --adaptiveYellow400:#ffd158; --adaptiveYellow50:#fff9e7; --adaptiveYellow500:#ffc342;
  --adaptiveYellow600:#ffb331; --adaptiveYellow700:#faa131; --adaptiveYellow800:#ee8f11;
  --adaptiveYellow900:#dd7d02;
  /* -- Teal -- */
  --adaptiveTeal100:#bce9e9; --adaptiveTeal200:#89d8d8; --adaptiveTeal300:#58c7c7;
  --adaptiveTeal400:#30b6b6; --adaptiveTeal50:#edf8f8; --adaptiveTeal500:#18a5a5;
  --adaptiveTeal600:#109595; --adaptiveTeal700:#0c8585; --adaptiveTeal800:#097575;
  --adaptiveTeal900:#076565;
  /* -- Purple -- */
  --adaptivePurple100:#edccf8; --adaptivePurple200:#da9bef; --adaptivePurple300:#c770e4;
  --adaptivePurple400:#b44bd7; --adaptivePurple50:#f9f0fc; --adaptivePurple500:#a234c7;
  --adaptivePurple600:#9128b4; --adaptivePurple700:#8222a2; --adaptivePurple800:#73228e;
  --adaptivePurple900:#65237b;
}

:root{
  /* ── 타이포 : TDS t1~t7 ── */
  --t1: 30px; --t1-lh: 40px;
  --t2: 26px; --t2-lh: 35px;
  --t3: 22px; --t3-lh: 31px;
  --t4: 20px; --t4-lh: 29px;
  --t5: 17px; --t5-lh: 25.5px;
  --t6: 15px; --t6-lh: 22.5px;
  --t7: 13px; --t7-lh: 19.5px;

  /* ── 데스크톱 확장 (t1 위 계단) ── */
  --display: clamp(38px, 7vw, 76px);
  --headline: clamp(26px, 3.4vw, 42px);
  --title: clamp(21px, 2.2vw, 30px);

  /* ── 간격 : TDS ListRow 스케일 ── */
  --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px;
  --s5: 40px; --s6: 64px; --s7: 96px; --s8: 140px;

  /* ── 라운드 ── */
  --r-card: 20px; --r-lg: 28px; --r-pill: 999px;

  /* ── 레이아웃 ── */
  --wrap: 1180px;
  --gut: clamp(20px, 5vw, 64px);

  /* ── 문서 아키타입 전용 색 (가이드 PDF 배지) ── */
  --badge-step: #6b7fc7;
  --badge-sample: #f26522;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;
  font-size:var(--t5); line-height:var(--t5-lh);
  color:var(--adaptiveGrey800);
  background:var(--adaptiveBackgroundLevelB01);
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }
h1,h2,h3,h4,p,ul,ol,figure{ margin:0; }
ul{ list-style:none; padding:0; }

.wrap{ max-width:var(--wrap); margin-inline:auto; padding-inline:var(--gut); }
.sec{ padding-block:var(--s8); }
@media (max-width:720px){ .sec{ padding-block:var(--s7); } }

/* ─────────────────────────────────────────────
   워터마크 — 제안서 전 페이지 우상단 규칙
   ───────────────────────────────────────────── */
.watermark{
  position:fixed; top:76px; right:clamp(16px,4vw,40px); z-index:40;  /* GNB(60px) 아래 */
  font-size:var(--t7); line-height:var(--t7-lh); letter-spacing:.01em;
  color:var(--adaptiveGrey400); pointer-events:none;
  transition:color .3s ease, opacity .25s ease, visibility .25s ease;
}
.watermark.on-dark{ color:rgba(255,255,255,.55); }
/* 표지를 지나 GNB가 상단에 붙으면 메뉴와 겹치므로 감춘다 */
.watermark.is-hidden{ opacity:0; visibility:hidden; }

/* ─────────────────────────────────────────────
   내비게이션
   ───────────────────────────────────────────── */
.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--adaptiveHairlineBorder);
}
.nav__in{
  max-width:var(--wrap); margin-inline:auto; padding:0 var(--gut);
  height:60px; display:flex; align-items:center; gap:var(--s4);
}
.nav__name{ font-size:var(--t6); font-weight:700; color:var(--adaptiveGrey900); letter-spacing:-.01em; white-space:nowrap; }
.nav__links{ display:flex; gap:var(--s4); margin-left:auto; overflow-x:auto; scrollbar-width:none; }
.nav__links::-webkit-scrollbar{ display:none; }
.nav__links a{
  font-size:var(--t7); line-height:var(--t7-lh); text-decoration:none;
  color:var(--adaptiveGrey600); white-space:nowrap; padding:6px 0;
  border-bottom:2px solid transparent; transition:color .18s, border-color .18s;
}
.nav__links a:hover{ color:var(--adaptiveBlue500); border-bottom-color:var(--adaptiveBlue500); }
.nav__links a .n{ color:var(--adaptiveGrey400); margin-right:5px; font-variant-numeric:tabular-nums; }
/* GNB 우측 액션 — 표지를 지나면 등장 (자리를 미리 잡아 레이아웃이 튀지 않게) */
.nav__acts{
  display:flex; gap:8px; margin-left:var(--s3); flex-shrink:0;
  opacity:0; transform:translateY(-4px); pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.nav--acts .nav__acts{ opacity:1; transform:none; pointer-events:auto; }
.nav__acts .btn{
  height:36px; padding:0 14px; border-radius:10px;
  font-size:var(--t7); font-weight:700;
}
/* 900px 이하에서는 GNB 액션을 감추고 우하단 플로팅 메뉴가 대신한다 */
@media (max-width:900px){ .nav .nav__acts{ display:none; } }
@media (max-width:640px){
  .nav__name{ display:none; }
  .nav__links{ margin-left:0; }
}

/* ─────────────────────────────────────────────
   [A] 표지 — 대각선 블루 그라데이션 + 좌측 정렬
   제안서 p1 아키타입
   ───────────────────────────────────────────── */
.cover{
  position:relative; overflow:hidden; isolation:isolate;
  min-height:min(88vh,760px); display:flex; align-items:center;
  background:linear-gradient(118deg,#1957c2 0%,#2272eb 42%,#0d8fd6 100%);
}
.cover::before,.cover::after{ content:""; position:absolute; inset:0; z-index:-1; }
/* 대각선으로 갈라지는 면 — 표지의 핵심 */
.cover::before{
  background:#3182f6;
  clip-path:polygon(58% 0,100% 0,100% 100%,0 100%);
  opacity:.55;
}
.cover::after{
  background:#1b64da;
  clip-path:ellipse(56% 78% at 96% 34%);
  opacity:.42;
}
.cover__in{ position:relative; width:100%; padding-block:var(--s7); }
.cover__eyebrow{
  font-size:var(--t7); line-height:var(--t7-lh); letter-spacing:.14em;
  text-transform:uppercase; color:rgba(255,255,255,.72); margin-bottom:var(--s4);
}
.cover h1{
  font-size:var(--display); line-height:1.06; font-weight:800; letter-spacing:-.035em;
  color:#fff; margin-bottom:var(--s2);
}
.cover__role{
  font-size:var(--headline); line-height:1.24; font-weight:700; letter-spacing:-.025em;
  color:rgba(255,255,255,.94); margin-bottom:var(--s4);
}
/* 한글 밑 얇은 영문 부제 — 제안서 표지 규칙 */
.cover__sub{
  font-size:clamp(15px,1.5vw,21px); line-height:1.4; font-weight:400;
  color:rgba(255,255,255,.7); letter-spacing:.01em; margin-bottom:var(--s5);
}
.cover__lead{
  font-size:clamp(16px,1.5vw,20px); line-height:1.65; color:rgba(255,255,255,.9);
  max-width:37em; margin-bottom:var(--s5);
}
.cover__lead b{ font-weight:700; color:#fff; }
.cover__acts{ display:flex; flex-wrap:wrap; gap:var(--s2); }
/* 표지 우측 인물 사진 */
.cover__top{
  display:grid; grid-template-columns:1fr auto;
  gap:clamp(28px,5vw,72px); align-items:center;
}
.cover__txt{ min-width:0; }
.cover__photo{
  position:relative; margin:0; padding:0; border:0; background:none;
  -webkit-appearance:none; appearance:none; cursor:pointer;
  width:clamp(120px,12vw,164px); aspect-ratio:1;
  transition:transform .3s ease;
}
.cover__photo:active{ transform:scale(.96); }
.cover__photo:focus-visible{ outline:3px solid #fff; outline-offset:6px; border-radius:50%; }
.cover__photo img{
  position:absolute; inset:0; display:block; width:100%; height:100%;
  border-radius:50%; object-fit:cover;
  box-shadow:0 0 0 4px rgba(255,255,255,.16), 0 16px 38px rgba(0,25,54,.28);
  transition:opacity .35s ease;
}
/* 평소엔 캐릭터, 올리면 실사로 */
.cover__photo--char{ object-position:center 46%; opacity:1; }
.cover__photo--real{ object-position:center 36%; opacity:0; }
/* 마우스가 있는 환경 : 올리면 실사 */
@media (hover:hover){
  .cover__photo:hover{ transform:translateY(-3px); }
  .cover__photo:hover .cover__photo--char{ opacity:0; }
  .cover__photo:hover .cover__photo--real{ opacity:1; }
}
/* 터치 환경 : 한 번 누르면 실사, 다시 누르면 캐릭터 */
.cover__photo.is-real .cover__photo--char{ opacity:0; }
.cover__photo.is-real .cover__photo--real{ opacity:1; }
@media (max-width:900px){
  .cover__top{ grid-template-columns:1fr; gap:var(--s5); justify-items:start; }
  .cover__photo{ order:-1; }          /* MO 에서는 사진이 먼저 */
  .cover__photo{ width:104px; }
  .cover__photo img{ box-shadow:0 0 0 3px rgba(255,255,255,.16), 0 10px 26px rgba(0,25,54,.26); }
}
/* 화면설계서는 PC에서만 — 900px 이하는 우하단 플로팅 메뉴가 담당한다 */
@media (max-width:900px){ .cover__acts--pc{ display:none; } }

/* TDS Button — color × variant × display × size 4축 구조 차용 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:52px; padding:0 26px; border-radius:14px; border:0;
  font-family:inherit; font-size:var(--t5); font-weight:600; letter-spacing:-.01em;
  text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.btn:hover{ transform:translateY(-2px); }
.btn--light-fill{ background:#fff; color:var(--adaptiveBlue700); box-shadow:0 8px 24px rgba(0,0,0,.16); }
.btn--light-weak{ background:rgba(255,255,255,.16); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.42); }
.btn--primary-fill{ background:var(--adaptiveBlue500); color:#fff; box-shadow:0 8px 22px rgba(49,130,246,.3); }
.btn--primary-weak{ background:var(--adaptiveBlue50); color:var(--adaptiveBlue700); }
.btn--sm{ height:42px; padding:0 18px; font-size:var(--t6); border-radius:11px; }

.cover__meta{
  margin-top:var(--s6); padding-top:var(--s4);
  border-top:1px solid rgba(255,255,255,.22);
  display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5);
  font-size:var(--t7); line-height:var(--t7-lh); color:rgba(255,255,255,.72);
}
.cover__meta b{ color:#fff; font-weight:600; }

/* ─────────────────────────────────────────────
   섹션 헤더 — 제목 좌상단 고정 + 회색 부제
   ───────────────────────────────────────────── */
.shead{ margin-bottom:var(--s6); }
.shead__no{
  display:inline-block; font-size:var(--t7); line-height:var(--t7-lh); font-weight:700;
  letter-spacing:.16em; color:var(--adaptiveBlue500); margin-bottom:var(--s2);
}
.shead h2{
  font-size:var(--headline); line-height:1.22; font-weight:800;
  letter-spacing:-.03em; color:var(--adaptiveGrey900);
}
.shead h2 em{ font-style:normal; color:var(--adaptiveBlue500); }
.shead p{
  margin-top:var(--s3); font-size:var(--t5); line-height:1.6;
  color:var(--adaptiveGrey600); max-width:60em;
}
.shead p b{ color:var(--adaptiveGrey800); font-weight:600; }
/* 안내 페이지 가로 구분선 — 가이드 p2·p4 규칙 */
.shead--ruled{ border-bottom:1px solid var(--adaptiveHairlineBorder); padding-bottom:var(--s4); }

/* ─────────────────────────────────────────────
   [B] 섹션 간지 — 단색 블루 전면 + 제목 한 줄
   제안서 p23 아키타입 (부제·목차 없음)
   ───────────────────────────────────────────── */
.divider{
  background:var(--adaptiveBlue500);
  min-height:min(46vh,380px); display:flex; align-items:flex-end;
  padding-block:var(--s6);
}
.divider__in{ width:100%; }
.divider__no{
  font-size:var(--t7); line-height:var(--t7-lh); letter-spacing:.18em;
  color:rgba(255,255,255,.62); margin-bottom:var(--s2);
}
.divider h2{
  font-size:clamp(32px,5.2vw,64px); line-height:1.08; font-weight:800;
  letter-spacing:-.035em; color:#fff;
}

/* ─────────────────────────────────────────────
   프로필 표 — 라운드 박스 + 가로선만 (제안서 p24)
   ───────────────────────────────────────────── */
.dl{ display:grid; grid-template-columns:minmax(96px,150px) 1fr; }
.dl > div{
  display:contents;
}
.dl dt,.dl dd{
  padding:15px 4px; border-bottom:1px solid var(--adaptiveGrey100); margin:0;
  font-size:var(--t6); line-height:var(--t6-lh);
}
.dl dt{ color:var(--adaptiveGrey600); font-weight:600; }
.dl dd{ color:var(--adaptiveGrey800); }
.dl dt:last-of-type,.dl dd:last-of-type{ border-bottom:0; }
/* 인적사항 — 카드 없이 표만 (dt/dd 2쌍 4열) */
.dl--plain{
  grid-template-columns:minmax(88px,128px) 1fr minmax(88px,128px) 1fr;
  column-gap:var(--s5);
}
.dl--plain dt,.dl--plain dd{ border-bottom:1px solid var(--adaptiveGrey200); }
.dl--plain dt:nth-last-of-type(-n+2),
.dl--plain dd:nth-last-of-type(-n+2){ border-bottom:0; }
@media (max-width:820px){
  .dl--plain{ grid-template-columns:minmax(88px,128px) 1fr; column-gap:0; }
  .dl--plain dt:nth-last-of-type(-n+2),
  .dl--plain dd:nth-last-of-type(-n+2){ border-bottom:1px solid var(--adaptiveGrey200); }
  .dl--plain dt:last-of-type,.dl--plain dd:last-of-type{ border-bottom:0; }
}

.foot-note{
  margin-top:var(--s3); font-size:var(--t7); line-height:1.7; color:var(--adaptiveGrey500);
}
.foot-note li::before{ content:"* "; }

/* 섹션 내부 블록 제목 */
.blk-h{
  font-size:var(--t3); font-weight:800; color:var(--adaptiveGrey900);
  letter-spacing:-.025em; margin-bottom:var(--s5);
}
/* 제목 옆 수치 배지 */
.blk-h__badge{
  display:inline-block; vertical-align:middle; margin-left:var(--s3);
  padding:5px 12px; border-radius:99px;
  background:var(--adaptiveBlue50); color:var(--adaptiveBlue600);
  font-size:var(--t6); font-weight:700; letter-spacing:-.01em;
  transform:translateY(-2px);
}

/* ─────────────────────────────────────────────
   [C] 순서 도식 — 화살표 도형 세로 적층, 색 농도 진행
   가이드 p3 아키타입 (경력 타임라인에 적용)
   ───────────────────────────────────────────── */
.flow{ display:grid; grid-template-columns:minmax(200px,268px) 1fr; gap:0 var(--s5); }
.flow__steps{ display:flex; flex-direction:column; gap:6px; }
.flow__step{ flex:1 1 auto; }
.flow__step{
  position:relative; padding:22px 16px 30px; text-align:center;
  clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%); /* ↓ 향하는 화살표 */
  color:#fff; font-weight:700; font-size:var(--t6); line-height:var(--t6-lh);
}
/* 아래로 갈수록 진해짐 */
.flow__step:nth-child(1){ background:#c9e2ff; color:var(--adaptiveBlue900); }
.flow__step:nth-child(2){ background:#90c2ff; color:var(--adaptiveBlue900); }
.flow__step:nth-child(3){ background:#4593fc; }
.flow__step:nth-child(4){ background:#1b64da; }
.flow__step small{ display:block; font-size:var(--t7); font-weight:500; opacity:.82; margin-top:3px; }
.flow__descs{ display:flex; flex-direction:column; gap:var(--s5); }
.flow__desc h4{
  font-size:var(--t4); line-height:var(--t4-lh); font-weight:700;
  color:var(--adaptiveGrey900); letter-spacing:-.02em; margin-bottom:var(--s1);
}
.flow__desc .org{ font-size:var(--t7); color:var(--adaptiveBlue500); font-weight:600; margin-bottom:var(--s2); }
.flow__desc p{ font-size:var(--t6); line-height:1.68; color:var(--adaptiveGrey700); }
/* ">" 하위 항목 — 가이드 p3 규칙 */
.chev{ margin-top:var(--s2); display:flex; flex-wrap:wrap; gap:6px 14px; }
.chev li{ font-size:var(--t7); line-height:var(--t7-lh); color:var(--adaptiveGrey600); }
.chev li::before{ content:"›"; color:var(--adaptiveBlue400); font-weight:700; margin-right:6px; }
@media (max-width:820px){
  .flow{ grid-template-columns:1fr; gap:var(--s4); }
  .flow__steps{ flex-direction:row; gap:4px; }
  .flow__step{ flex:1; clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%); padding:16px 10px; font-size:var(--t7); }
  .flow__step small{ display:none; }
}

/* ─────────────────────────────────────────────
   프로젝트 — 단계 배지 + 파란 실선 강조
   가이드 p6~19 반복 템플릿
   ───────────────────────────────────────────── */
.proj{ margin-bottom:var(--s8); }
.proj:last-child{ margin-bottom:0; }
/* 청보라 알약 배지, 상단 중앙 고정 */
.stepbadge{
  display:block; width:fit-content; margin:0 auto var(--s4);
  background:var(--badge-step); color:#fff; border-radius:var(--r-pill);
  padding:9px 26px; font-size:var(--t6); line-height:var(--t6-lh); font-weight:700;
  letter-spacing:-.01em;
}
.proj__head{ text-align:center; margin-bottom:var(--s5); }
/* 굵은 지시문 1줄 */
.proj__claim{
  font-size:var(--title); line-height:1.3; font-weight:800;
  letter-spacing:-.028em; color:var(--adaptiveGrey900); margin-bottom:var(--s2);
}
.proj__claim em{ font-style:normal; color:var(--adaptiveBlue500); }
/* 회색 보조 설명 */
.proj__sub{ font-size:var(--t6); line-height:var(--t6-lh); color:var(--adaptiveGrey500); }
.tags{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:var(--s3); }
.tag{
  font-size:var(--t7); line-height:1; padding:7px 12px; border-radius:var(--r-pill);
  background:var(--adaptiveGrey100); color:var(--adaptiveGrey700); font-weight:600;
}
.tag--key{ background:var(--adaptiveBlue50); color:var(--adaptiveBlue700); }

/* 파란 실선 강조 — 가이드의 "여기를 보라" 표시 */
.shot{
  position:relative; border:1px solid var(--adaptiveGrey200);
  overflow:hidden; background:var(--adaptiveBackgroundLevel01);
}
.shot img{ width:100%; height:100%; object-fit:cover; object-position:top center; }
/* 주황 "예시" 배지 — 실제 화면이 아님을 못 박음 */
.samplebadge{
  position:absolute; top:12px; right:12px; z-index:3;
  background:var(--badge-sample); color:#fff; border-radius:8px;
  padding:6px 14px; font-size:var(--t7); line-height:1; font-weight:700;
  letter-spacing:.02em; box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.proj__body{ display:grid; grid-template-columns:1.15fr 1fr; gap:var(--s5); align-items:stretch; }
@media (max-width:900px){
  .proj__body{ grid-template-columns:1fr; align-items:start; }
  .shot img{ height:auto; object-fit:fill; }
}

/* 아이콘 + 설명 2줄 세로 나열 — 제안서 p20 아키타입 */
.points{ display:flex; flex-direction:column; gap:var(--s4); justify-content:space-between; }
.point{ display:flex; gap:var(--s3); align-items:flex-start; }
.point__ico{
  flex:0 0 auto; width:42px; height:42px; border-radius:50%;
  display:grid; place-items:center; font-size:17px; font-weight:800;
  background:var(--adaptiveBlue50); color:var(--adaptiveBlue600);
  font-variant-numeric:tabular-nums;
}
.point p{ font-size:var(--t6); line-height:1.68; color:var(--adaptiveGrey700); }
.point p b{ color:var(--adaptiveGrey900); font-weight:700; }
.point p .hl{ color:var(--adaptiveBlue600); font-weight:700; }
/* 성과 강조 */
.result{
  margin-top:var(--s4); padding-top:var(--s3);
  border-top:1px solid var(--adaptiveBlue200);
  font-size:var(--t6); line-height:1.6; color:var(--adaptiveBlue700); font-weight:600;
}
.result b{ font-size:var(--t4); font-weight:800; letter-spacing:-.02em; }

/* ─────────────────────────────────────────────
   [G] AS-IS / TO-BE — 명암 반전 좌우 분할
   제안서 p10 아키타입
   ───────────────────────────────────────────── */
.compare{
  display:grid; grid-template-columns:1fr auto 1fr; gap:0;
  margin-top:var(--s5);
}
.compare__side{ padding:clamp(24px,3.4vw,46px); }
.compare__side--as{ background:#17171c; color:#fff; }
.compare__side--to{ background:var(--adaptiveBackgroundLevel01); }
.compare__tag{
  font-size:var(--t7); line-height:var(--t7-lh); font-weight:700;
  letter-spacing:.1em; margin-bottom:var(--s3);
}
.compare__side--as .compare__tag{ color:rgba(255,255,255,.55); }
.compare__side--to .compare__tag{ color:var(--adaptiveBlue500); }
.compare__side h4{
  font-size:var(--t3); line-height:var(--t3-lh); font-weight:800;
  letter-spacing:-.025em; margin-bottom:var(--s3);
}
.compare__side--to h4{ color:var(--adaptiveGrey900); }
.compare__list li{
  font-size:var(--t6); line-height:1.62; padding:11px 0 11px 20px; position:relative;
}
.compare__side--as .compare__list li{ color:rgba(255,255,255,.72); border-bottom:1px solid rgba(255,255,255,.1); }
.compare__side--to .compare__list li{ color:var(--adaptiveGrey700); border-bottom:1px solid var(--adaptiveGrey100); }
.compare__list li::before{
  content:""; position:absolute; left:2px; top:19px;
  width:6px; height:6px; border-radius:50%;
}
.compare__side--as .compare__list li::before{ background:rgba(255,255,255,.32); }
.compare__side--to .compare__list li::before{ background:var(--adaptiveBlue400); }
.compare__list li:last-child{ border-bottom:0; }
/* 가운데 흰 화살표 */
.compare__arrow{
  display:grid; place-items:center; background:var(--adaptiveGrey100);
  padding-inline:clamp(12px,2vw,26px); color:var(--adaptiveBlue500);
  font-size:28px; font-weight:800;
}
@media (max-width:820px){
  .compare{ grid-template-columns:1fr; }
  /* 박스를 돌리면 세로 띠가 되므로, 박스는 그대로 두고 글리프만 아래 화살표로 바꾼다 */
  .compare__arrow{
    transform:none; padding:12px 0; font-size:0; line-height:0;
  }
  .compare__arrow::after{ content:"↓"; font-size:24px; line-height:1; }
}

/* ─────────────────────────────────────────────
   [J] 스윔레인 프로세스 — 2행, 담당 구분, 색 농도 진행
   제안서 p25 아키타입
   ───────────────────────────────────────────── */
.swim{
  margin-top:var(--s5); background:var(--adaptiveBackgroundLevel01);
  border-radius:var(--r-lg); padding:clamp(20px,3vw,40px); overflow-x:auto;
}
.swim__grid{ min-width:660px; display:grid; grid-template-columns:118px 1fr; gap:var(--s4) var(--s4); align-items:center; }
.swim__who{
  font-size:var(--t7); line-height:1.5; font-weight:700; color:var(--adaptiveGrey700); text-align:center;
}
.swim__who span{
  display:grid; place-items:center; width:46px; height:46px; margin:0 auto 8px;
  border-radius:50%; font-size:20px;
}
.swim__who--me span{ background:var(--adaptiveBlue50); }
.swim__who--them span{ background:var(--adaptiveGrey100); }
.swim__lane{ display:flex; align-items:center; gap:10px; }
.swim__box{
  flex:1; text-align:center; border-radius:14px; padding:16px 10px;
  font-size:var(--t7); line-height:1.42; font-weight:700;
}
.swim__box small{ display:block; font-weight:500; opacity:.8; margin-top:4px; font-size:11.5px; }
.swim__lane--me .swim__box:nth-child(1){ background:#c9e2ff; color:var(--adaptiveBlue900); }
.swim__lane--me .swim__box:nth-child(3){ background:#90c2ff; color:var(--adaptiveBlue900); }
.swim__lane--me .swim__box:nth-child(5){ background:#4593fc; color:#fff; }
.swim__lane--me .swim__box:nth-child(7){ background:#1957c2; color:#fff; }
.swim__lane--them .swim__box{ background:var(--adaptiveGrey100); color:var(--adaptiveGrey700); }
/* 실선 / 점선 화살표 2종 */
.arw{ flex:0 0 26px; text-align:center; color:var(--adaptiveGrey400); font-weight:800; }
.arw--dot{ letter-spacing:2px; font-weight:600; }

/* ─────────────────────────────────────────────
   [F] 3열 카드 — 제안서 p6·8·15·18 (최다 사용)
   카피(강조어만 블루) → 아이콘 → 설명
   ───────────────────────────────────────────── */
.cards{ display:grid; gap:var(--s4); }
.cards--3{ grid-template-columns:repeat(3,1fr); }
.cards--2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:900px){ .cards--3{ grid-template-columns:1fr; } .cards--2{ grid-template-columns:1fr; } }
.card{
  background:var(--adaptiveBackgroundLevel01); border-radius:var(--r-lg);
  padding:clamp(24px,2.6vw,36px);
  display:flex; flex-direction:column;
  transition:transform .22s ease, box-shadow .22s ease;
}
.card:hover{ transform:translateY(-4px); box-shadow:0 14px 40px rgba(0,25,54,.09); }
@media (prefers-reduced-motion:reduce){ .card:hover{ transform:none; } }
.card__copy{
  font-size:var(--t4); line-height:1.42; font-weight:700;
  letter-spacing:-.022em; color:var(--adaptiveGrey900); margin-bottom:var(--s4);
}
.card__copy em{ font-style:normal; color:var(--adaptiveBlue500); }
.card__fig{
  margin:auto 0 var(--s4); border-radius:14px; overflow:hidden;
  background:var(--adaptiveGrey50); border:1px solid var(--adaptiveGrey100);
}
.card__fig img{ width:100%; aspect-ratio:4/3; object-fit:cover; object-position:top; }
.card__desc{ font-size:var(--t6); line-height:1.68; color:var(--adaptiveGrey600); }
.card__desc b{ color:var(--adaptiveGrey800); font-weight:600; }
.card__no{
  font-size:var(--t7); line-height:1; font-weight:800; letter-spacing:.1em;
  color:var(--adaptiveBlue400); margin-bottom:var(--s2); font-variant-numeric:tabular-nums;
}
/* 지시 + 이유 2단 구조 — 가이드 p4 규칙 */

/* 산출물 3열 — 예시 배지 얹은 도큐먼트 카드 */
/* 문서 샘플은 카드로 되돌리지 않는다 */
.doccard{
  background:none; border-radius:0; padding:var(--s4) 0 0;
  border-top:2px solid var(--adaptiveGrey300);
}
.doccard:hover{ transform:none; box-shadow:none; }
.doccard__shot{ position:relative; border:1px solid var(--adaptiveGrey200); }
.doccard__shot img{ width:100%; aspect-ratio:16/10; object-fit:cover; object-position:top center; }
.doccard__txt{ padding:var(--s3) 0 0; }
.doccard__kind{ font-size:var(--t7); font-weight:700; color:var(--adaptiveBlue500); margin-bottom:6px; }
.doccard__name{ font-size:var(--t5); line-height:1.42; font-weight:700; color:var(--adaptiveGrey900); letter-spacing:-.02em; }

/* 문서 갈래 3분류 */
.kinds{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-bottom:var(--s6); }
.kind{ padding:0 var(--s5); border-left:1px solid var(--adaptiveHairlineBorder); }
.kind:first-child{ padding-left:0; border-left:0; }
.kind:last-child{ padding-right:0; }
/* 분류마다 색이 한 단계씩 진해지는 키라인 */
.kind::before{
  content:""; display:block; width:38px; height:3px; border-radius:2px;
  margin-bottom:var(--s3); background:var(--adaptiveBlue300);
}
.kind:nth-child(2)::before{ background:var(--adaptiveBlue500); }
.kind:nth-child(3)::before{ background:var(--adaptiveBlue700); }
.kind h4{
  font-size:var(--t4); font-weight:800; color:var(--adaptiveGrey900);
  letter-spacing:-.025em; margin-bottom:var(--s3);
}
.kind ul{ display:flex; flex-direction:column; gap:9px; }
.kind ul li{
  position:relative; padding-left:15px;
  font-size:var(--t6); line-height:1.5; color:var(--adaptiveGrey600);
}
.kind ul li::before{
  content:""; position:absolute; left:0; top:.66em;
  width:7px; height:1.5px; border-radius:1px; background:var(--adaptiveBlue200);
}
@media (max-width:760px){
  .kinds{ grid-template-columns:1fr; gap:var(--s4); }
  .kind{ padding:var(--s4) 0 0; border-left:0; border-top:1px solid var(--adaptiveHairlineBorder); }
  .kind:first-child{ padding-top:0; border-top:0; }
}

/* ─────────────────────────────────────────────
   활용 툴
   ───────────────────────────────────────────── */
/* ───────────────────────────────────────────
   활용 툴 — 아이콘 + 숙련도 게이지 (순차 차오름)
   ─────────────────────────────────────────── */
.tools{ display:grid; grid-template-columns:repeat(7,1fr); gap:var(--s4) var(--s3); }
@media (max-width:1080px){ .tools{ grid-template-columns:repeat(4,1fr); } }
@media (max-width:640px){ .tools{ grid-template-columns:repeat(2,1fr); gap:var(--s4) var(--s2); } }
.tool{ display:flex; flex-direction:column; text-align:center; }
.tool img{ width:38px; height:38px; margin:0 auto 12px; object-fit:contain; }
.tool__n{
  font-size:var(--t7); line-height:1.4; font-weight:700;
  letter-spacing:-.02em; color:var(--adaptiveGrey800);
  flex:1 0 auto;   /* 게이지를 아래로 밀어 모든 칸의 기준선을 맞춘다 */
}

/* 숙련도 게이지 — 화면에 들어오면 왼쪽 항목부터 차례로 채워진다 */
.tool__meter{
  margin-top:14px; height:7px; border-radius:99px;
  background:var(--adaptiveGrey200); overflow:hidden;
}
.tool__meter i{
  display:block; height:100%; width:0; border-radius:99px;
  background:var(--adaptiveBlue700);   /* 상 — 진한 파랑 */
  transition:width 1s cubic-bezier(.22,1,.36,1);
}
.rise.in .tool__meter i{ width:var(--lv); }
.tool--mid .tool__meter i{ background:var(--adaptiveBlue200); }   /* 중 — 옅은 파랑 */
.tool:nth-child(1) .tool__meter i{ transition-delay:0.12s; }
.tool:nth-child(2) .tool__meter i{ transition-delay:0.28s; }
.tool:nth-child(3) .tool__meter i{ transition-delay:0.44s; }
.tool:nth-child(4) .tool__meter i{ transition-delay:0.60s; }
.tool:nth-child(5) .tool__meter i{ transition-delay:0.76s; }
.tool:nth-child(6) .tool__meter i{ transition-delay:0.92s; }
.tool:nth-child(7) .tool__meter i{ transition-delay:1.08s; }

/* ─────────────────────────────────────────────
   맺음말 — 블루 전면 + 중앙 CTA (제안서 p26)
   ───────────────────────────────────────────── */
.closing{
  background:linear-gradient(118deg,#1957c2 0%,#2272eb 44%,#0d8fd6 100%);
  position:relative; overflow:hidden; isolation:isolate; text-align:center;
  padding-block:var(--s8);
}
.closing::before{
  content:""; position:absolute; inset:0; z-index:-1; background:#3182f6;
  clip-path:polygon(52% 0,100% 0,100% 100%,10% 100%); opacity:.5;
}
.closing h2{
  font-size:clamp(26px,3.8vw,50px); line-height:1.24; font-weight:800;
  letter-spacing:-.032em; color:#fff; margin-bottom:var(--s4);
}
.closing p{
  font-size:clamp(15px,1.5vw,19px); line-height:1.7; color:rgba(255,255,255,.86);
  max-width:44em; margin:0 auto var(--s6);
}
.closing__acts{ display:flex; flex-wrap:wrap; gap:var(--s2); justify-content:center; }
/* 맺음말 연락처 — 버튼 대신 글자로 한 번 더 */
.closing__contact{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:var(--s2) var(--s4);
}
.closing__contact a{
  font-size:clamp(19px,2.3vw,30px); line-height:1.35; font-weight:700;
  letter-spacing:-.02em; color:#fff; text-decoration:none;
  padding-bottom:3px; border-bottom:1.5px solid rgba(255,255,255,.34);
  transition:border-color .18s ease;
}
.closing__contact a:hover{ border-bottom-color:#fff; }
.closing__sep{
  width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5);
}
@media (max-width:560px){ .closing__sep{ display:none; } }

/* ─────────────────────────────────────────────
   푸터
   ───────────────────────────────────────────── */
.foot{ background:#17171c; color:rgba(255,255,255,.55); padding-block:var(--s5); }
.foot__in{ display:flex; flex-wrap:wrap; gap:var(--s3) var(--s5); align-items:center; justify-content:space-between; }
.foot__name{ font-size:var(--t7); letter-spacing:.1em; font-weight:700; color:rgba(255,255,255,.8); }
.foot__c{ display:flex; flex-wrap:wrap; gap:var(--s4); font-size:var(--t7); }
.foot__c a{ text-decoration:none; color:rgba(255,255,255,.7); }
.foot__c a:hover{ color:#fff; }

/* ─────────────────────────────────────────────
   문서 뷰어 모달 — 화면설계서 상세보기
   ───────────────────────────────────────────── */
.doccard__more{ margin-top:var(--s3); }
.doccard__more span{ font-size:1.05em; line-height:1; }

.docmodal{
  position:fixed; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(12px,2.4vw,32px);
}
.docmodal[hidden]{ display:none; }
.docmodal__scrim{
  position:fixed; inset:0; background:rgba(0,12,30,.84);
  animation:dm-fade .2s ease;
}
.docmodal__panel{
  position:relative; z-index:1;
  width:min(1420px,100%); height:100%;
  display:flex; flex-direction:column;
  background:var(--adaptiveBackgroundLevel01); border-radius:var(--r-lg);
  box-shadow:0 30px 80px rgba(0,12,30,.4); overflow:hidden;
  animation:dm-pop .24s cubic-bezier(.22,1,.36,1);
}
@keyframes dm-fade{ from{ opacity:0 } to{ opacity:1 } }
@keyframes dm-pop{ from{ opacity:0; transform:translateY(14px) scale(.985) } to{ opacity:1; transform:none } }

.docmodal__head{
  flex:0 0 auto;
  display:flex; align-items:flex-start; gap:var(--s3);
  padding:var(--s4) var(--s4) var(--s3);
  border-bottom:1px solid var(--adaptiveGrey200);
}
.docmodal__headtxt{ min-width:0; }
.docmodal__eyebrow{
  font-size:var(--t7); line-height:var(--t7-lh); font-weight:700;
  color:var(--adaptiveBlue500); letter-spacing:.02em; margin-bottom:4px;
}
.docmodal__title{
  font-size:var(--t3); line-height:1.3; font-weight:800;
  color:var(--adaptiveGrey900); letter-spacing:-.025em;
  overflow-wrap:anywhere;
}
.docmodal__tools{ margin-left:auto; display:flex; align-items:center; gap:var(--s3); flex-shrink:0; }
.docmodal__count{ font-size:var(--t6); font-weight:600; color:var(--adaptiveGrey500); white-space:nowrap; }
.docmodal__count b{ color:var(--adaptiveGrey900); font-weight:800; }
.docmodal__x{
  width:40px; height:40px; border:0; border-radius:12px; cursor:pointer;
  background:var(--adaptiveGrey100); color:var(--adaptiveGrey700);
  font-family:inherit; font-size:17px; line-height:1;
  transition:background .16s ease, color .16s ease;
}
.docmodal__x:hover{ background:var(--adaptiveGrey200); color:var(--adaptiveGrey900); }

.docmodal__stage{
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  background:var(--adaptiveGrey50);
}
.docmodal__scroll{
  width:100%; height:100%; padding:var(--s3);
  display:flex; align-items:center; justify-content:center;
}
.docmodal__stage img{
  display:block; width:100%; height:100%;
  object-fit:contain; object-position:center;
}
#dm-img2{ display:none; }
.docmodal__arrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:48px; height:48px; border:0; border-radius:50%; cursor:pointer;
  background:var(--adaptiveBackgroundLevel01); color:var(--adaptiveGrey800);
  box-shadow:0 4px 16px rgba(0,25,54,.18);
  font-family:inherit; font-size:26px; line-height:1; padding:0 0 3px;

.crew{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s4); }

/* ── 캐릭터 상시 애니메이션 ── */
@keyframes cha-rock { 0%,100%{ transform:rotate(-9deg); } 50%{ transform:rotate(9deg); } }
@keyframes cha-float{ 0%,100%{ transform:translateY(0); }  50%{ transform:translateY(-6px); } }
@keyframes cha-spin { 0%,100%{ transform:rotate(0); }      50%{ transform:rotate(22deg); } }
@keyframes cha-beat { 0%,100%{ transform:scale(1); }       45%{ transform:scale(1.18); } }
@keyframes cha-type { 0%{ stroke-dashoffset:16; } 40%,100%{ stroke-dashoffset:0; } }
.cha-pen{ transform-box:fill-box; transform-origin:50% 8%;  animation:cha-rock 2.9s ease-in-out infinite; }
.cha-f1 { transform-box:fill-box; transform-origin:center;  animation:cha-float 3.2s ease-in-out infinite; }
.cha-f2 { transform-box:fill-box; transform-origin:center;  animation:cha-spin 4.1s ease-in-out infinite; }

/* ───────────────────────────────────────────

.ai{

}
@media (max-width:1000px){ .ai{ grid-template-columns:1fr; gap:var(--s5); align-items:start; } }

/* ── 일러스트 상시 반복 애니메이션 (요소 단위) ── */
@keyframes aia-pulse  { 0%,100%{ transform:scale(1); }        45%{ transform:scale(1.16); } }
@keyframes aia-breathe{ 0%,100%{ transform:scale(1); }        50%{ transform:scale(1.07); } }
@keyframes aia-rock   { 0%,100%{ transform:rotate(0); }       30%{ transform:rotate(-6deg); } 62%{ transform:rotate(4deg); } }
@keyframes aia-rotate { to{ transform:rotate(360deg); } }
@keyframes aia-slide  { 0%,100%{ transform:translateY(0); }   50%{ transform:translateY(-4px); } }
@keyframes aia-grow   { 0%,100%{ transform:scaleY(1); }       50%{ transform:scaleY(.6); } }
@keyframes aia-drop   { 0%,100%{ transform:translateY(0); }   50%{ transform:translateY(3px); } }
@keyframes aia-tilt   { 0%,100%{ transform:rotate(-8deg); }   50%{ transform:rotate(-12.5deg); } }

/* 01 MCP 연결 — 허브가 숨쉬고 노드 3개가 차례로 뛴다 */
.aia-hub{ transform-box:fill-box; transform-origin:center; animation:aia-breathe 3.4s ease-in-out infinite; }
.aia-node{ transform-box:fill-box; transform-origin:center; animation:aia-pulse 2.7s ease-in-out infinite; }
.aia-node--2{ animation-delay:.6s; }
.aia-node--3{ animation-delay:1.2s; }

/* 02 작업 툴 — 손잡이가 흔들리고 걸쇠가 뛴다 */
.aia-handle{ transform-box:fill-box; transform-origin:50% 100%; animation:aia-rock 4.4s ease-in-out infinite; }
.aia-latch{ transform-box:fill-box; transform-origin:center; animation:aia-pulse 3.3s ease-in-out infinite .4s; }

/* 03 자동화 — 순환 화살표가 계속 돌고 시곗바늘이 따라 돈다 */
.aia-spin{ transform-box:view-box; transform-origin:32px 32px; animation:aia-rotate 7s linear infinite; }
.aia-hand{ transform-box:view-box; transform-origin:32px 32px; animation:aia-rotate 12s linear infinite; }

/* 04 폴더 — 안쪽 서류가 올라왔다 내려간다 */
.aia-paper{ transform-box:fill-box; animation:aia-slide 3.6s ease-in-out infinite; }

/* 05 데이터 — 막대가 시차를 두고 오르내린다 */
.aia-bar{ transform-box:fill-box; transform-origin:50% 100%; animation:aia-grow 3s ease-in-out infinite; }
.aia-bar--2{ animation-delay:.35s; }
.aia-bar--3{ animation-delay:.7s; }

/* 06 보고자료 — 뒷장이 기울고 북마크가 내려온다 */
.aia-back{ transform-box:fill-box; transform-origin:center; transform:rotate(-8deg); animation:aia-tilt 5.2s ease-in-out infinite; }
.aia-mark{ transform-box:fill-box; animation:aia-drop 3.4s ease-in-out infinite; }

@media (prefers-reduced-motion:reduce){
  .aia-hub,.aia-node,.aia-handle,.aia-latch,.aia-spin,.aia-hand,
  .aia-paper,.aia-bar,.aia-mark{ animation:none; }
  .aia-back{ animation:none; }
}

/* ───────────────────────────────────────────
   바이브코딩 산출물 버튼 — 기존 .btn 변형을 그대로 쓰고

@keyframes live-ping{ 0%{ transform:scale(1); opacity:.55; } 80%,100%{ transform:scale(2.8); opacity:0; } }
.proj__live{ display:flex; justify-content:center; margin-top:var(--s3); }
@media (prefers-reduced-motion:reduce){ .live-dot::after{ animation:none; } }

/* ───────────────────────────────────────────

/* 탭 바 = 헤더 */
.lvmodal__bar{
  display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--s4); border-bottom:1px solid var(--adaptiveHairlineBorder);
}
.lvmodal__tabs{
  flex:1 1 auto; min-width:0; display:flex; gap:var(--s5);
  overflow-x:auto; scrollbar-width:none;
}
.lvmodal__tabs::-webkit-scrollbar{ display:none; }
.lvtab{
  flex:0 0 auto; padding:18px 0 15px; border:0; border-bottom:2px solid transparent;
  margin-bottom:-1px; background:none; cursor:pointer; text-align:left;
  font-family:inherit; font-size:var(--t5); font-weight:700; letter-spacing:-.02em;
  color:var(--adaptiveGrey600); transition:color .18s, border-color .18s;
}
.lvtab small{
  display:block; margin-top:3px; font-size:var(--t7); font-weight:500;
  color:var(--adaptiveGrey400); letter-spacing:-.01em;
}
.lvtab:hover{ color:var(--adaptiveGrey900); }
.lvtab[aria-selected="true"]{ color:var(--adaptiveBlue500); border-bottom-color:var(--adaptiveBlue500); }
.lvtab[aria-selected="true"] small{ color:var(--adaptiveBlue400); }
.lvmodal__x{
  flex:0 0 auto; width:40px; height:40px; border:0; border-radius:12px;
  background:var(--adaptiveGrey100); color:var(--adaptiveGrey600);
  font-size:22px; line-height:1; cursor:pointer;
}
.lvmodal__x:hover{ background:var(--adaptiveGrey200); color:var(--adaptiveGrey900); }
/* 화면 */
.lvmodal__stage{ flex:1 1 auto; min-height:0; background:var(--adaptiveGrey100); }
.lvmodal__stage iframe{ display:block; width:100%; height:100%; border:0; background:#fff; }
.lvmodal__foot{
  display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  padding:10px var(--s4); border-top:1px solid var(--adaptiveHairlineBorder);
  font-size:var(--t7); line-height:1.6; color:var(--adaptiveGrey500);
}
.lvmodal__foot a{ color:var(--adaptiveBlue600); font-weight:700; }
.lvmodal__replay{
  margin-left:auto; height:30px; padding:0 12px; border:0; border-radius:8px;
  background:var(--adaptiveBlue50); color:var(--adaptiveBlue700);
  font-family:inherit; font-size:var(--t7); font-weight:700; cursor:pointer;
}
.lvmodal__replay:hover{ background:var(--adaptiveBlue100); }
@media (max-width:760px){
  .lvmodal{ padding:0; }
  .lvmodal__panel{ max-height:100%; border-radius:0; }
  .lvmodal__bar{ padding:0 var(--s3); gap:var(--s3); }
  .lvmodal__tabs{ gap:var(--s4); }
  .lvtab{ padding:14px 0 12px; font-size:var(--t6); }
  .lvmodal__foot{ padding:8px var(--s3); }
}

/* ── 스크롤 등장 ── */
.rise{ opacity:0; transform:translateY(22px); transition:opacity .6s ease, transform .6s ease; }
.rise.in{ opacity:1; transform:none; }
@media (prefers-reduced-motion:reduce){
  .rise{ opacity:1; transform:none; transition:none; }
  .cover__photo,.cover__photo img{ transition:none; }
  .cover__photo:active{ transform:none; }
  .tool__meter i{ transition:none; transition-delay:0s; }
  html{ scroll-behavior:auto; }
  .btn:hover,.card:hover{ transform:none; }
}

/* ── 인쇄 ── */
@page{ size:A4; margin:14mm 15mm; }

/* ═══════════════════════════════════════════════════════════
   인쇄 = 문서 타입 · 무채색
   면 채움과 색을 전부 걷어내고 글자·괘선·여백만으로 위계를 만든다.
   화면 스타일에는 영향이 없다.
   ═══════════════════════════════════════════════════════════ */
@media print{
  /* ── 화면 전용 요소 제거 ── */
  .nav,.watermark,.fab,.cover__acts,.closing__acts,.doccard__more,
  .cover::before,.cover::after,.closing::before{ display:none !important; }

  /* ── 색 전면 제거 ── */
  *,*::before,*::after{
    background:none !important;
    box-shadow:none !important;
    text-shadow:none !important;
    color:#1a1a1a !important;
    border-color:#c8c8c8 !important;
    border-radius:0 !important;
  }
  html,body{ background:#fff !important; }
  img{ filter:grayscale(1) !important; }
  svg{ filter:grayscale(1) !important; }

  /* ── 회색 단계로 위계 ── */
  .shead p,.blk-lead,.track__d,.crew__d,.cover__sub,.cover__eyebrow,
  .proj__sub,.foot-note,.doccard__kind,.kind ul li,.stat span,
  .card__desc,.compare__tag,.swim__who span,.foot__name,.foot__c a{
    color:#5a5a5a !important;
  }
  em,b,strong,.hl,.result b{ color:#000 !important; font-style:normal; }

  /* ── 표지 : 문서 표제지 ── */
  .cover{
    min-height:0 !important; display:block !important;
    padding-block:0 26px !important;
    border-bottom:2px solid #1a1a1a !important;
    break-after:page;
  }
  .cover__in{ padding-block:0 !important; }
  .cover__top{ display:flex !important; align-items:center; gap:22px; }
  .cover__photo{ width:88px !important; order:0 !important; }
  .cover__photo img{ border-radius:50% !important; }
  .cover h1{ font-size:34px !important; margin-bottom:2px; }
  .cover__role{ font-size:17px !important; }
  .cover__lead{ font-size:12pt !important; }
  .cover__meta{ border-top:1px solid #c8c8c8 !important; }

  /* ── 간지 : 장 제목 ── */
  .divider{
    min-height:0 !important; padding-block:10px 6px !important;
    border-top:2px solid #1a1a1a !important; border-bottom:1px solid #c8c8c8 !important;
    break-before:page; break-after:avoid;
  }
  .divider h2{ font-size:19px !important; }
  .divider__no{ font-size:9.5pt !important; color:#5a5a5a !important; }

  /* ── 섹션 ── */
  .sec{ padding-block:20px !important; }
  .shead{ margin-bottom:16px !important; }
  .shead--ruled{ border-bottom:1px solid #c8c8c8 !important; }
  .shead h2{ font-size:17px !important; }
  .blk-h{ font-size:14pt !important; border-bottom:1px solid #dcdcdc; padding-bottom:5px; }

  /* ── 배지·칩 : 채움 대신 괘선 ── */
  .stepbadge,.tag,.blk-h__badge,.crew__role,.samplebadge{
    border:1px solid #b4b4b4 !important; padding:2px 8px !important;
    font-size:9pt !important; font-weight:600 !important;
  }
  .samplebadge{ position:static !important; display:inline-block; margin-bottom:4px; }

  /* ── 도식 : 면 대신 테두리 ── */
  .flow__step,.swim__box,.compare__side,.card,.crew__c,.doccard,.kind,.stat,.tool{
    border:1px solid #c8c8c8 !important;
  }
  .flow__step,.swim__box{ padding:8px 12px !important; font-size:10pt !important; }
  .compare__side{ padding:14px 16px !important; }
  .card,.crew__c,.doccard{ padding:14px 16px !important; }
  .kind,.stat,.tool{ border:0 !important; border-top:1px solid #c8c8c8 !important; padding-top:10px !important; }
  .kind::before{ background:#1a1a1a !important; height:2px !important; width:26px !important; }
  .kind ul li::before,.compare__list li::before,.chev li::before{ background:#8a8a8a !important; color:#8a8a8a !important; }
  .result{ border-top:1px solid #1a1a1a !important; padding-top:8px !important; }
  .point__ico{ border:1px solid #b4b4b4 !important; }

  /* ── 타임라인 ── */
  .track__i::before{ background:#1a1a1a !important; }
  .track__i::after{ background:#c8c8c8 !important; }
  .track__i{ flex:0 0 auto !important; padding-bottom:12px !important; }

  /* ── 활용 툴 게이지 ── */
  .tool__meter{ background:#e4e4e4 !important; height:6px !important; }
  .tool__meter i{ background:#1a1a1a !important; width:var(--lv) !important; transition:none !important; }
  .tools{ grid-template-columns:repeat(4,1fr) !important; }

  /* ── AI 활용 ── */
  .ai__disc{ border:1px solid #c8c8c8 !important; border-radius:50% !important; }
  .ai__no{ color:#5a5a5a !important; }

  /* ── 프로필 사진은 실사, 캐릭터는 숨김 ── */
  .cover__photo--char{ opacity:0 !important; }
  .cover__photo--real{ opacity:1 !important; }

  /* ── 스크롤 등장 해제 ── */
  .rise{ opacity:1 !important; transform:none !important; }

  /* ── 캡처 : 축소해 통째로 싣는다 ── */
  .mgmt__fig{ max-height:none !important; }
  .mgmt,.proj__body,.ai{ align-items:start !important; }
  .shot,.mgmt__fig,.doccard__shot{
    width:fit-content !important; margin-inline:auto !important;
    border:1px solid #c8c8c8 !important;
  }
  .shot img,.mgmt__fig img{
    height:auto !important; max-height:88mm !important;
    width:auto !important; max-width:100% !important; object-fit:contain !important;
  }
  .doccard__shot img{ height:auto !important; max-height:46mm !important; object-fit:contain !important; }

  /* ── 페이지 분할 ── */
  .card,.doccard,.crew__c,.tool,.ai__i,.track__i,.kind,.compare,.shot,.mgmt__fig,
  .flow__desc,.point{ break-inside:avoid; }
  .shead,.blk-h,.proj__head{ break-after:avoid; }

  /* ── 스윔레인 : 이모지 무채색화 + 지면 폭 안으로 ── */
  .swim__who span{ filter:grayscale(1) !important; }
  .swim{ overflow:visible !important; }
  .swim__grid{ min-width:0 !important; grid-template-columns:72px 1fr !important; gap:10px !important; }
  .swim__lane{ flex-wrap:wrap !important; row-gap:6px !important; }
  .swim__box{ font-size:9pt !important; padding:6px 9px !important; }
  .arw{ flex:0 0 18px !important; }

  /* ── 맺음말 · 푸터 ── */
  .closing{ border-top:2px solid #1a1a1a !important; padding-block:22px !important; }
  .closing h2{ font-size:16px !important; }
  .foot{ border-top:1px solid #c8c8c8 !important; padding-block:10px !important; }
}
